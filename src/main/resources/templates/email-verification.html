<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Email Verification</title>
</head>
<body style="font-family:Arial,sans-serif; margin:0; padding:20px;">
  <div style="max-width:600px; margin:auto; border:1px solid #ddd; border-radius:8px; overflow:hidden;">
    <div style="background:#3f51b5; color:#fff; padding:20px; text-align:center;">
      <h1>Verify Your Email</h1>
    </div>
    <div style="padding:20px;">
      <p>Hi there!</p>
      <p>Your verification code is:</p>
      <p style="font-size:24px; font-weight:bold; letter-spacing:4px;" th:text="${code}">0000</p>
      <p>This code will expire in <strong th:text="${expireMinutes}">10</strong> minutes.</p>
      <p>If you didn’t request this, you can safely ignore this email.</p>
    </div>
    <div style="background:#f1f1f1; padding:10px; text-align:center; font-size:12px; color:#666;">
      &copy; 2025 Homeopathy Clinic
    </div>
  </div>
</body>
</html>
