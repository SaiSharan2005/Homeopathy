<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Appointment Confirmation</title>
</head>
<body style="font-family:Arial,sans-serif; margin:0; padding:0;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" bgcolor="#f7f7f7" style="padding:20px 0;">
        <table width="600" cellpadding="0" cellspacing="0"
               style="background:#fff; border-radius:8px; overflow:hidden;">
          <!-- header -->
          <tr>
            <td bgcolor="#3f51b5" style="padding:20px; text-align:center; color:#fff;">
              <h1>Homeopathy Clinic</h1>
            </td>
          </tr>
          <!-- body -->
          <tr>
            <td style="padding:20px;">
              <h2>Appointment Booked Successfully</h2>
              <p>Dear <strong th:text="${patientName}">Patient</strong>,</p>
              <p>Your appointment has been confirmed!</p>
              <ul>
                <li><strong>Token:</strong> <span th:text="${token}"></span></li>
                <li><strong>Date:</strong>  <span th:text="${date}"></span></li>
                <li><strong>Status:</strong><span th:text="${status}"></span></li>
                <li><strong>Doctor:</strong><span th:text="${doctorName}"></span></li>
              </ul>
              <p>Thank you for choosing our clinic. We look forward to seeing you.</p>
            </td>
          </tr>
          <!-- footer -->
          <tr>
            <td bgcolor="#f1f1f1" style="padding:10px; text-align:center; font-size:12px; color:#666;">
              &copy; 2025 Homeopathy Clinic. All rights reserved.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
